name: Deploy vns_api

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Sync files to production folder
      run: rsync -av --exclude 'venv' --exclude '__pycache__' --exclude '.git' ./ /home/ubuntu/projects/vns_api/

    - name: Install dependencies
      working-directory: /home/ubuntu/projects/vns_api
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Deploy with PM2
      working-directory: /home/ubuntu/projects/vns_api
      run: pm2 restart vns_api || pm2 start "venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000" --name vns_api
