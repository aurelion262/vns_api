name: Deploy vns_api

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup environment
      run: cp .env.prod .env

    - name: Deploy with PM2
      run: pm2 restart vns_api || pm2 start "uvicorn main:app --host 0.0.0.0 --port 8000" --name vns_api
